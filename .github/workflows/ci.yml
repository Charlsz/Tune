name: CI

# Lint + tests sin GPU. Nunca entrena en cada push (plan.md, Fase 4.4).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (núcleo + api + dev, sin torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (unitarios + integración de API, sin GPU)
        run: pytest -m "not gpu" --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Build imagen api
        run: docker build -f docker/api/Dockerfile -t tune-api:ci .
