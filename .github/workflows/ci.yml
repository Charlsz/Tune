name: CI

# Lint + tests sin GPU. Nunca entrena en cada push (plan.md, Fase 4.4).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (núcleo + api + dev, sin torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (unitarios + integración de API, sin GPU)
        run: pytest -m "not gpu" --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (typecheck + vite)
        working-directory: web
        run: |
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build imagen api
        run: docker build -f docker/api/Dockerfile -t tune-api:ci .

      - name: Build imagen web
        run: docker build -t tune-web:ci web
