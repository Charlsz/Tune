# Smoke EO optimized: backbone congelado + FP16 (proxy eficiente; LoRA r/alpha en full run).
strategy: optimized

dataset:
  name: hls_burn_scars
  version: "1.0"
  root: hls_burn_scars/1.0
  splits: [train, val, test]

model:
  name: prithvi-eo-2.0-300m
  source: ibm-nasa-geospatial/Prithvi-EO-2.0-300M
  task: segmentation

training:
  seed: 42
  epochs: 1
  batch_size: 2
  learning_rate: 1.0e-4
  precision: "16-mixed"

peft:
  method: lora
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [qkv, proj]

extra:
  freeze_backbone: true
  early_stopping_patience: 2
  num_workers: 2
  limit_train_batches: 4
  limit_val_batches: 2
  limit_test_batches: 2
