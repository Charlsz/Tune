# Caso smoke CPU: fine-tune de ResNet18 **ya preentrenado** (ImageNet).
# Dataset pequeño ImageFolder (CIFAR-10 subset como proxy local liviano).
# El caso científico Burn Scars/Prithvi sigue en configs/training/ (GPU).
strategy: baseline

dataset:
  name: cifar10_smoke
  version: "1.0"
  root: cifar10_smoke/1.0
  splits: [train, val, test]

model:
  name: resnet18-imagenet
  source: torchvision/resnet18
  task: classification

training:
  seed: 42
  epochs: 1
  batch_size: 8
  learning_rate: 1.0e-3
  precision: "32"

peft: null

extra:
  image_size: 64
  freeze_backbone: false
  early_stopping_patience: 2
  num_workers: 0
