# Estrategia OPTIMIZED: misma tarea, menos recursos.
# Solo cambia lo que explica el ahorro (backbone congelado + mixed precision). Todo lo demás
# se mantiene idéntico al baseline para que la comparación sea defendible.
strategy: optimized

dataset:
  name: hls_burn_scars
  version: "1.0"
  root: hls_burn_scars/1.0
  splits: [train, val, test]

model:
  name: prithvi-eo-2.0-300m
  source: ibm-nasa-geospatial/Prithvi-EO-2.0-300M
  task: segmentation

training:
  seed: 42
  epochs: 20
  batch_size: 8
  learning_rate: 1.0e-4
  precision: "16-mixed"

# Sin LoRA: el trainer de segmentación (TerraTorch) no lo aplica. El ahorro viene
# de congelar el backbone (solo decoder entrenable) + FP16.
peft: null

extra:
  freeze_backbone: true
  early_stopping_patience: 5
  num_workers: 4
