# App: GeoTIFF → máscara Prithvi.  make app-up  → http://localhost:8080
# Laboratorio de fine-tuning: lab/docker-compose.yml  (make -C lab experiment)

name: tune

services:
  eo-api:
    build:
      context: .
      dockerfile: docker/eo/Dockerfile
    container_name: tune-eo-api
    env_file: .env
    command: uvicorn tune.interfaces.api.main:app --host 0.0.0.0 --port 8000
    environment:
      TUNE_TRACKER: json
      TUNE_ARTIFACTS_DIR: /app/artifacts
      # .env gana si define TUNE_CORS_ORIGINS. Si no, Vite y la web local.
      # La clave `environment` pisa env_file: un valor fijo aquí ignoraba el .env.
      TUNE_CORS_ORIGINS: ${TUNE_CORS_ORIGINS:-http://localhost:5173,http://localhost:${WEB_PORT:-8080}}
      HF_HOME: /app/.hf_cache
    ports:
      # En una VM pública: API_BIND=127.0.0.1 y entra solo por nginx (:WEB_PORT).
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
      - hf-cache:/app/.hf_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
    container_name: tune-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      eo-api:
        condition: service_healthy

volumes:
  hf-cache:
