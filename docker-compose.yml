# Tune — entorno local dockerizado.
#
# Lab U (un comando):  make lab-up  /  make lab-down
# Smoke CPU:           make smoke-run / make smoke-down
# Manual:              docker compose up -d mlflow api
#
# Apagar siempre al terminar para no dejar contenedores consumiendo recursos.

name: tune

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: tune-mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: tune-api
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro

  training:
    build:
      context: .
      dockerfile: docker/training/Dockerfile
    profiles: ["training"]
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TUNE_DATA_DIR: /app/data
      TUNE_CONFIGS_DIR: /app/configs
      TUNE_ARTIFACTS_DIR: /app/artifacts
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./src:/app/src
      - ./scripts:/app/scripts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  training-cpu:
    build:
      context: .
      dockerfile: docker/training/Dockerfile.cpu
    profiles: ["smoke"]
    env_file: .env
    environment:
      TUNE_TRACKER: json
      TUNE_DATA_DIR: /app/data
      TUNE_CONFIGS_DIR: /app/configs/smoke
      TUNE_ARTIFACTS_DIR: /app/artifacts
      TUNE_MODEL_NAME: tune-smoke
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./src:/app/src
      - ./scripts:/app/scripts:ro

volumes:
  mlflow-data:
