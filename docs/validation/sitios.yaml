# Sitios de validación global. Cualquier coordenada vale; estos son
# controles de coherencia, no un territorio exclusivo del producto.

task: flood
max_cloud: 30
side_km: 20

sites:
  # India/España = máscara de agua (Sen1Floods11). No demuestran inundación sola:
  # hace falta un "antes" del mismo territorio. Ver casos-demostracion.md.
  - id: spain
    kind: example
    example_id: spain
    note: Escena oficial Sen1Floods11. Máscara de agua; JRC suele dar poca permanente.

  - id: india
    kind: example
    example_id: india
    note: Escena oficial Sen1Floods11. Máscara de agua.

  - id: magdalena
    kind: catalog
    label: Bajo Magdalena (Colombia)
    center: { lat: 8.85, lon: -74.65 }
    side_km: 12
    dates:
      dry: ["2022-02-22"]
      peak: ["2022-05-08"]
    items:
      dry: S2B_18PWQ_20220222_0_L2A
      peak: S2A_18PWQ_20220508_0_L2A
    note: Par seca→húmeda 2022. Analizar dry antes que peak (history_baseline).

  - id: pakistan
    kind: catalog
    label: Sindh (Pakistán)
    center: { lat: 27.70, lon: 68.85 }
    side_km: 12
    dates:
      pre: ["2022-05-18"]
      peak: ["2022-09-05"]
    items:
      pre: S2B_42RVR_20220518_0_L2A
      peak: S2B_42RVR_20220905_0_L2A
    note: Inundación 2022. Par pre→peak; el pico debe mostrar nueva ≫ permanente.

  - id: mississippi
    kind: catalog
    label: Mississippi (EE. UU.)
    center: { lat: 37.00, lon: -89.18 }
    side_km: 12
    dates:
      pre: ["2018-09-18"]
      peak: ["2019-06-10"]
    items:
      pre: S2B_16SBF_20180918_0_L2A
      peak: S2A_16SBF_20190610_0_L2A
    note: Crecida 2019 vs base 2018; mucha permanente estable + nueva medible.

controls:
  river_ratio_max: 0.15
  spain_persistent_required: true
