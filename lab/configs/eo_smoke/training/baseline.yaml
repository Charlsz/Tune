# Smoke EO en lab U: 1 epoch, batches limitados, batch pequeño.
# Mismo modelo/dataset que lab/configs/training; solo reduce cómputo.
strategy: baseline

dataset:
  name: hls_burn_scars
  version: "1.0"
  root: hls_burn_scars/1.0
  splits: [train, val, test]

model:
  name: prithvi-eo-2.0-300m
  source: ibm-nasa-geospatial/Prithvi-EO-2.0-300M
  task: segmentation

training:
  seed: 42
  epochs: 1
  batch_size: 2
  learning_rate: 1.0e-4
  precision: "32"

peft: null

extra:
  early_stopping_patience: 2
  num_workers: 2
  limit_train_batches: 4
  limit_val_batches: 2
  limit_test_batches: 2
