[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tune"
version = "0.1.0"
description = "Análisis satelital de inundación con Prithvi-EO 2.0 (IBM-NASA). Incluye laboratorio académico de fine-tuning opcional."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Carlos Andrés Galvis Pájaro" },
  { name = "Zenen Contreras Royero" },
]
# Núcleo: sin frameworks de ML. Solo lo que necesita el dominio, la carga de
# configuración y la CLI. Todo lo pesado va en extras para que la API y los
# tests puedan instalarse sin torch.
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Servir la API y el catálogo STAC (sin torch)
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "numpy>=1.26",
  # Referencia / reproyección de máscaras (sin torch)
  "rasterio>=1.3",
  "affine>=2.3,<3",
  "pystac-client>=0.7",
]
# Tracking y registry (laboratorio MLOps; la app de inundación usa TUNE_TRACKER=json)
tracking = [
  "mlflow>=2.12",
]
# Runtime de inferencia Prithvi (TerraTorch + PyTorch). Requerido por la app
# de inundación. Preferir: `pip install -e ".[api,inference]"`.
inference = [
  "torch>=2.2",
  "torchvision>=0.17",
  "lightning>=2.2",
  "peft>=0.10",
  # transformers 5.x falla al importar con torch 2.4: NameError nn no definido
  # en integrations/accelerate.py (HuggingFace #43784).
  "transformers>=4.40,<5",
  "numpy>=2.2",
  "psutil>=5.9",
  "huggingface_hub>=0.23",
  # La base pytorch 2.4 trae Python 3.11. terratorch >=1.2.12 exige torchgeo 0.9,
  # que solo existe para Python >=3.12; 1.2.11 + torchgeo 0.8 resuelve con torch 2.4.
  "terratorch==1.2.11",
  "torchgeo<0.9",
  "albumentations>=1.4",
  "rasterio>=1.3",
  # affine 3.x (attrs + cached_property) rompe bounds/transform en rasterio:
  # "No '__dict__' attribute on 'Affine' instance to cache '_astuple'".
  "affine>=2.3,<3",
  "einops>=0.7",
]
# Histórico: mismo conjunto que `inference` (lab fine-tune + runtime Prithvi).
# Docker/Make siguen usando `training` para no romper despliegues.
training = [
  "torch>=2.2",
  "torchvision>=0.17",
  "lightning>=2.2",
  "peft>=0.10",
  "transformers>=4.40,<5",
  "numpy>=2.2",
  "psutil>=5.9",
  "huggingface_hub>=0.23",
  "terratorch==1.2.11",
  "torchgeo<0.9",
  "albumentations>=1.4",
  "rasterio>=1.3",
  "affine>=2.3,<3",
  "einops>=0.7",
]
# Desarrollo y CI
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "pre-commit>=3.7",
]

[project.scripts]
tune = "tune.interfaces.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tune = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "lab/scripts"]
extend-exclude = ["notebooks", "data", "lab/data", "lab/notebooks", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]  # typer.Option en defaults es idiomático

[tool.ruff.lint.isort]
known-first-party = ["tune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: pruebas que levantan la API o tocan servicios",
  "gpu: pruebas que requieren GPU (no corren en CI)",
]

[tool.coverage.run]
source = ["src/tune"]
