server {
  listen 80;
  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://eo-api:8000/api/;
    proxy_read_timeout 600s;   # primera inferencia descarga pesos
    proxy_request_buffering off;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
